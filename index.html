<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ChromaRevive — Trasforma le tue foto in bianco e nero in immagini a colori grazie all'intelligenza artificiale.">
    <title>ChromaRevive | AI Image Colorization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-ambient" aria-hidden="true"></div>

    <header>
        <div class="header-brand">
            <h1>Chroma<span>Revive</span></h1>
        </div>
    </header>

    <main class="container">

        <section class="upload-section">

            <label class="upload-zone" id="drop-zone">
                <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <div class="upload-text">
                    Trascina qui la tua foto<br>o <span>sfoglia i file</span>
                </div>
                <input type="file" id="file-input" accept="image/*">
            </label>

            <div class="divider"></div>

            <div class="model-selection">
                <p class="section-label">Motore AI</p>
                <div class="model-options">

                    <div class="model-option active" data-model="coco15k" id="model-coco15k">
                        <div class="option-header">
                            <span class="model-badge">COCO</span>
                            <div class="check-icon"></div>
                        </div>
                        <span class="model-title">COCO Dataset (15k)</span>
                        <p>Addestrato su 15.000 immagini del dataset COCO.</p>
                    </div>

                    <div class="model-option" data-model="final25k" id="model-final25k">
                        <div class="option-header">
                            <span class="model-badge secondary">MirFlickr</span>
                            <div class="check-icon"></div>
                        </div>
                        <span class="model-title">MirFlickr (10k)</span>
                        <p>Addestrato su 10.000 immagini dal dataset MirFlickr.</p>
                    </div>

                </div>
            </div>

        </section>

        <section class="comparison-container">

            <div class="comparison-wrapper" id="slider-container">

                <div class="label label-before">Originale B&W</div>
                <div class="label label-after">AI Colorized</div>

                <div class="loading-overlay" id="loading-overlay">
                    <div class="spinner"></div>
                    <p>Elaborazione in corso…</p>
                    <div class="loading-bar"></div>
                </div>

                <img src="placeholder.png" alt="Immagine colorizzata dall'AI" class="comparison-img after-img" id="after-img">
                <img src="placeholder.png" alt="Immagine originale in bianco e nero" class="comparison-img before-img" id="before-img">

                <div class="slider-handle" id="slider-handle"></div>
            </div>

            <div class="actions" id="actions-panel" style="display: none;">
                <button class="btn btn-secondary" id="restart-btn" onclick="location.reload()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path></svg>
                    Nuova foto
                </button>
                <button class="btn btn-primary" id="download-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
                    Scarica
                </button>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
